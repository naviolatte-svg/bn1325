<!doctype html>
<!--
CARA EDIT UNTUK NAVIOLATTE
1. Cari teks AUTHOR dengan Ctrl+F / Command+F.
2. Wallpaper universe 1: ubah wallpapers menjadi
   ['wallpaper-violin.jpg', '', '', '']
3. Foto: contohnya selfie: {src:'hao-selfie.jpg', title:'A small break', kind:'portrait'}.
   Avatar: portraits: {hao:'hao-avatar.jpg', hanbin:'hanbin-avatar.jpg', ...}.
4. Simpan semua gambar bersama index.html dan unggah juga ke GitHub.
   Jangan ubah nama key selfie/hanbin: yang diubah nama file dalam src saja.
5. Cari SCRIPTS untuk mengedit urutan dialog. M = balasan Hao, T = pesan masuk.
   P('crafts','teks') = foto masuk. S = catatan Hao, D = waktu cerita.
6. Jam dan tanggal mengikuti cerita, bukan tanggal perangkat reader.
7. Setelah mengedit cerita, uji dari awal lewat Settings > Restart from the beginning.
8. Rekaman Hao: isi AUTHOR.singing.src, contoh 'hao-singing.mp3'.
   Tiga bahasa: ubah TEXTS bila mengedit dialog; pilihan ada di lock screen dan Settings.
9. Musik Spotify: cari AUTHOR.songs. Ubah spotify untuk tautan lagu dan cover untuk gambar album.
   Tombol Play membuka Spotify. File lagu tidak perlu diunggah.
10. File untuk homepage GitHub Pages harus bernama persis index.html.

11. Foto artikel: cari AUTHOR.articleImages. Semua artikel sudah memakai foto yang terdaftar.
    Ganti nilai mc-announcement / rumour / hao-profile / hanbin-profile jika perlu; simpan foto di folder yang sama dengan index.html.
    Foto kontak di chat mengikuti AUTHOR.portraits.hanbin, bukan AUTHOR.photos.
    Setelah mengganti isi file foto dengan nama yang sama, naikkan assetVersion.
12. gallery memakai nama entri photos (selfie, violin, dst.), bukan nilai kind.
13. Avatar kontak: cari AUTHOR.portraits. Hanbin memakai array 4 foto (U1-U4).
    Foto Hanbin baru muncul setelah kontaknya disimpan di cerita.
    gyuvin/yujin/ollie/yunseo/seungeon dapat diisi nama file masing-masing.
    Mengubah AUTHOR.photos saja tidak mengganti avatar chat.
    Dua lembar profil Boys Planet sudah tertanam: tidak perlu unggah file tambahan.
14. Email Boys Planet ditulis sebagai korespondensi fiksi AU. Artikel memakai
    fakta profil yang diumumkan 29 Desember 2022, tanpa hasil kompetisi.
-->

    "body": "Zhang Hao, nama yang semakin meroket di industri hiburan Korea Selatan, bukan hanya dikenal karena wajah tampannya, tetapi juga karena prestasi gemilangnya. Dalam kurun waktu singkat, Zhang Hao berhasil mencatatkan penjualan album solois tertinggi, sebuah pencapaian yang membuat banyak orang terperangah. Setiap album yang dirilisnya laris manis di pasaran, menunjukkan betapa besar pengaruh dan daya tariknya di industri musik.\n\nTidak hanya itu, Zhang Hao juga menjadi brand ambassador untuk berbagai brand mewah. Mulai dari merek fashion ternama hingga produk teknologi canggih, wajahnya yang karismatik terpampang di berbagai kampanye iklan. Popularitasnya di dunia fashion semakin memperkuat posisinya sebagai ikon gaya hidup modern, mengukuhkan namanya di antara deretan selebriti papan atas.\n\nKesuksesan Zhang Hao tidak berhenti di situ. Di penghargaan MAMA tahun lalu, album Zhang Hao berhasil meraih penghargaan bergengsi Album of the Year, sebuah prestasi yang semakin mengukuhkan posisinya di puncak industri musik. Kritikus musik memuji kualitas album tersebut, menyebutnya sebagai karya masterpiece yang menunjukkan kematangan musikalitas dan kreativitas Zhang Hao. Sebuah hasil manis dari kerjasama yang baik antara idola dan juga fans setianya.\n\nDengan segala kesuksesan yang telah diraihnya, Zhang Hao kini tengah mempersiapkan diri untuk world tour yang sangat dinantikan oleh para penggemarnya di seluruh dunia. Zhang Hao, yang selalu perfeksionis dalam setiap penampilannya, memastikan bahwa setiap detail konser dipersiapkan dengan matang, mulai dari tata panggung, koreografi, hingga interaksi langsungnya dengan spektakuler.\n\nTiket konser yang terjual habis dalam hitungan menit menunjukkan betapa besarnya cinta dan dukungan untuk Zhang Hao. Di media sosial, tagar #ZhangHaoWorldTour menjadi trending topic, menandakan bahwa dunia siap menyambut sang bintang. Zhang Hao, dengan segala pesonanya, siap menggebrak panggung dunia dan menorehkan prestasi yang lebih gemilang lagi.",

    "body": "Sung Hanbin, nama yang sudah tidak asing lagi bagi warga Korea Selatan, namanya selalu menghiasi artikel-artikel teratas, entah apapun yang ia lakukan, wajah tampannya bisa dipastikan akan muncul di berbagai media lokal. Lagunya yang selalu memuncaki tangga lagu Korea Selatan merupakan bukti nyata dari kepiawaiannya dalam menciptakan musik yang mampu menggugah hati pendengar. Setiap kali ia merilis single baru, penggemar dan kritikus musik sama-sama terpukau oleh kualitas dan inovasi musikalitasnya.\n\nPencapaian Hanbin tidak berhenti di situ. Di penghargaan MAMA tahun lalu, ia dinobatkan sebagai Artist of the Year, sebuah penghargaan bergengsi yang mengakui kontribusinya yang luar biasa di dunia musik. Kemenangan ini tidak hanya menambah daftar panjang prestasinya, tetapi juga menjadi pengakuan atas dedikasinya yang tiada henti untuk mengembangkan seni musik.\n\nTidak hanya di bidang musik, Hanbin juga menunjukkan dominasinya dalam dunia endorsement dan periklanan. Sudah setahun penuh, ia berhasil mempertahankan posisi nomor satu dalam Brand Reputation setiap bulannya.\n\nSelain prestasinya di dunia musik dan iklan, Hanbin juga dikenal sebagai ‘Nation MC’. Kepiawaiannya dalam membawakan acara televisi dengan karisma dan kehangatan membuatnya dicintai oleh pemirsa dari berbagai kalangan. Hanbin memiliki kemampuan unik untuk membuat setiap acara yang dipandunya menjadi hidup, penuh dengan tawa dan emosi yang menyentuh. Sebagai MC, ia mampu mengendalikan suasana, memberikan wawasan mendalam, dan menghibur pemirsa dengan gaya bicaranya yang menawan.\n\nTidak hanya suara yang memukau, Hanbin juga memiliki kemampuan menari di atas rata-rata yang membuat setiap penampilannya begitu mengesankan. Gerakannya yang luwes dan penuh energi seolah memancarkan magnetisme yang memikat penonton. Keahliannya dalam menari melengkapi talenta musikalnya, menjadikan setiap panggung yang diisinya sebagai pertunjukan yang memukau dan tak terlupakan. Tidak heran jika Sung Hanbin berhasil mencuri hati banyak orang.",

],"29 December 2022 — first signal-song performance":["29 Desember 2022 — Penampilan perdana lagu tema","29 December 2022 — first signal-song performance","2022년 12월 29일 — 시그널송 첫 무대"],"Aku membuka lagi email lamaran yang pernah kukirim. Lalu email penerimaannya. Aku benar-benar akan berdiri di panggung itu.":["Aku membuka lagi email lamaran yang pernah kukirim. Lalu email penerimaannya. Aku benar-benar akan berdiri di panggung itu.","I opened the application email I had sent, then the acceptance email. I really would be standing on that stage.","내가 보냈던 지원 메일을 다시 열고, 합격 메일도 읽었다. 정말로 그 무대에 서게 되는 거다."],"Artikel peserta sudah terbit. Aku mencari namaku sendiri, lalu melihat nama lain di antara peserta K-Group.":["Artikel peserta sudah terbit. Aku mencari namaku sendiri, lalu melihat nama lain di antara peserta K-Group.","The contestant article was out. I searched for my own name, then spotted another name among the K-Group participants.","참가자 기사가 올라왔다. 내 이름을 찾다가 K그룹 참가자들 사이에서 또 다른 이름을 발견했다."],"Sung Han Bin. Nama itu lagi. Kali ini, kami ada di acara yang sama. Aku menatap profilnya sedikit lebih lama.":["Sung Han Bin. Nama itu lagi. Kali ini, kami ada di acara yang sama. Aku menatap profilnya sedikit lebih lama.","Sung Han Bin. That name again. This time, we were in the same programme. I looked at his profile a little longer.","성한빈. 또 그 이름이다. 이번에는 같은 프로그램에 있다. 그의 프로필을 조금 더 오래 바라봤다."],"Boys Planet · G-Group":["Boys Planet · G-Group","Boys Planet · G-Group","보이즈 플래닛 · G그룹"],"Sung Han Bin · K-Group":["Sung Han Bin · K-Group","Sung Han Bin · K-Group","성한빈 · K그룹"],"Seoul, South Korea":["Seoul, Korea Selatan","Seoul, South Korea","대한민국 서울"],"Sung Hanbin, nama yang sudah tidak asing lagi bagi warga Korea Selatan, namanya selalu menghiasi artikel-artikel teratas, entah apapun yang ia lakukan, wajah tampannya bisa dipastikan akan muncul di berbagai media lokal. Lagunya yang selalu memuncaki tangga lagu Korea Selatan merupakan bukti nyata dari kepiawaiannya dalam menciptakan musik yang mampu menggugah hati pendengar. Setiap kali ia merilis single baru, penggemar dan kritikus musik sama-sama terpukau oleh kualitas dan inovasi musikalitasnya.":["Sung Hanbin, nama yang sudah tidak asing lagi bagi warga Korea Selatan, namanya selalu menghiasi artikel-artikel teratas, entah apapun yang ia lakukan, wajah tampannya bisa dipastikan akan muncul di berbagai media lokal. Lagunya yang selalu memuncaki tangga lagu Korea Selatan merupakan bukti nyata dari kepiawaiannya dalam menciptakan musik yang mampu menggugah hati pendengar. Setiap kali ia merilis single baru, penggemar dan kritikus musik sama-sama terpukau oleh kualitas dan inovasi musikalitasnya.","Sung Hanbin is a familiar name to people in South Korea. His name always appears in the top articles; whatever he does, his handsome face is sure to appear in local media. His songs consistently top South Korean charts, clear proof of his skill in creating music that moves listeners. Whenever he releases a new single, fans and music critics alike are captivated by the quality and innovation of his musicality.","한국 사람들에게 이미 익숙한 이름, 성한빈. 무슨 일을 하든 그의 이름은 늘 주요 기사를 장식하고, 잘생긴 얼굴은 각종 국내 매체에 등장한다. 한국 음원 차트 정상에 꾸준히 오르는 그의 노래는 듣는 이의 마음을 움직이는 음악을 만드는 실력을 보여 준다. 새 싱글을 발표할 때마다 팬과 음악 평론가 모두 그의 음악적 완성도와 독창성에 감탄한다."],"Pencapaian Hanbin tidak berhenti di situ. Di penghargaan MAMA tahun lalu, ia dinobatkan sebagai Artist of the Year, sebuah penghargaan bergengsi yang mengakui kontribusinya yang luar biasa di dunia musik. Kemenangan ini tidak hanya menambah daftar panjang prestasinya, tetapi juga menjadi pengakuan atas dedikasinya yang tiada henti untuk mengembangkan seni musik.":["Pencapaian Hanbin tidak berhenti di situ. Di penghargaan MAMA tahun lalu, ia dinobatkan sebagai Artist of the Year, sebuah penghargaan bergengsi yang mengakui kontribusinya yang luar biasa di dunia musik. Kemenangan ini tidak hanya menambah daftar panjang prestasinya, tetapi juga menjadi pengakuan atas dedikasinya yang tiada henti untuk mengembangkan seni musik.","Hanbin’s achievements do not stop there. At last year’s MAMA awards, he was named Artist of the Year, a prestigious award recognising his exceptional contribution to music. The win not only added to his long list of achievements but also recognised his tireless dedication to developing the art of music.","한빈의 성과는 거기서 끝나지 않는다. 지난해 MAMA에서 그는 음악계에 대한 뛰어난 공헌을 인정받아 권위 있는 상인 Artist of the Year를 수상했다. 이 수상은 그의 긴 경력에 또 하나의 성과를 더했을 뿐 아니라 음악 예술을 발전시키려는 끊임없는 헌신을 인정한 것이기도 했다."],"Tidak hanya di bidang musik, Hanbin juga menunjukkan dominasinya dalam dunia endorsement dan periklanan. Sudah setahun penuh, ia berhasil mempertahankan posisi nomor satu dalam Brand Reputation setiap bulannya.":["Tidak hanya di bidang musik, Hanbin juga menunjukkan dominasinya dalam dunia endorsement dan periklanan. Sudah setahun penuh, ia berhasil mempertahankan posisi nomor satu dalam Brand Reputation setiap bulannya.","Hanbin also demonstrates his dominance beyond music, in endorsements and advertising. For an entire year, he has maintained the number-one position in Brand Reputation every month.","음악뿐 아니라 광고와 브랜드 협찬 분야에서도 한빈은 두각을 나타내고 있다. 그는 일 년 내내 매달 브랜드 평판 1위 자리를 지켰다."],"Selain prestasinya di dunia musik dan iklan, Hanbin juga dikenal sebagai ‘Nation MC’. Kepiawaiannya dalam membawakan acara televisi dengan karisma dan kehangatan membuatnya dicintai oleh pemirsa dari berbagai kalangan. Hanbin memiliki kemampuan unik untuk membuat setiap acara yang dipandunya menjadi hidup, penuh dengan tawa dan emosi yang menyentuh. Sebagai MC, ia mampu mengendalikan suasana, memberikan wawasan mendalam, dan menghibur pemirsa dengan gaya bicaranya yang menawan.":["Selain prestasinya di dunia musik dan iklan, Hanbin juga dikenal sebagai ‘Nation MC’. Kepiawaiannya dalam membawakan acara televisi dengan karisma dan kehangatan membuatnya dicintai oleh pemirsa dari berbagai kalangan. Hanbin memiliki kemampuan unik untuk membuat setiap acara yang dipandunya menjadi hidup, penuh dengan tawa dan emosi yang menyentuh. Sebagai MC, ia mampu mengendalikan suasana, memberikan wawasan mendalam, dan menghibur pemirsa dengan gaya bicaranya yang menawan.","Alongside his achievements in music and advertising, Hanbin is known as the “Nation MC”. His skill in hosting television programmes with charisma and warmth has made him beloved by viewers from all walks of life. He has a unique ability to bring every programme he hosts to life, filling it with laughter and moving emotions. As an MC, he can guide the atmosphere, offer thoughtful insights, and entertain viewers with his charming way of speaking.","음악과 광고 분야의 성과 외에도 한빈은 ‘국민 MC’로 알려져 있다. 카리스마와 따뜻함으로 방송을 진행하는 솜씨 덕분에 다양한 시청자들의 사랑을 받는다. 그는 자신이 진행하는 모든 프로그램에 생기를 불어넣고 웃음과 감동으로 채우는 특별한 능력을 지녔다. MC로서 분위기를 이끌고 깊이 있는 생각을 전하며 매력적인 말솜씨로 시청자들을 즐겁게 한다."],"Tidak hanya suara yang memukau, Hanbin juga memiliki kemampuan menari di atas rata-rata yang membuat setiap penampilannya begitu mengesankan. Gerakannya yang luwes dan penuh energi seolah memancarkan magnetisme yang memikat penonton. Keahliannya dalam menari melengkapi talenta musikalnya, menjadikan setiap panggung yang diisinya sebagai pertunjukan yang memukau dan tak terlupakan. Tidak heran jika Sung Hanbin berhasil mencuri hati banyak orang.":["Tidak hanya suara yang memukau, Hanbin juga memiliki kemampuan menari di atas rata-rata yang membuat setiap penampilannya begitu mengesankan. Gerakannya yang luwes dan penuh energi seolah memancarkan magnetisme yang memikat penonton. Keahliannya dalam menari melengkapi talenta musikalnya, menjadikan setiap panggung yang diisinya sebagai pertunjukan yang memukau dan tak terlupakan. Tidak heran jika Sung Hanbin berhasil mencuri hati banyak orang.","Beyond his captivating voice, Hanbin has exceptional dancing ability that makes every performance impressive. His fluid, energetic movements seem to radiate a magnetism that draws audiences in. His dancing complements his musical talent, making every stage he appears on captivating and unforgettabl function sound(kind='incoming'){
 if(!st.settings.sounds)return;const ctx=initAudio();if(!ctx||ctx.state!=='running')return;
 const now=ctx.currentTime;

function availableArticles(){

 if(st.world===2)return ARTICLES.filter(a=>(a.world===2||!Number.isInteger(a.world))&&(a.id==='mc-announcement'||a.id==='hao-profile'||a.id==='hanbin-profile'||st.newsUnlocked.includes(a.id)));

function renderManagerCall(){
 if(event()?.type!=='managerCalls')return;
 $('singing-audio').pause();$('singing-audio').hidden=true;
 $('call-content').innerHTML=`<div class="call-avatar">${avatar('manager')}</div><div class="call-person">${esc('Manager')}</div><div class="call-state">${esc('incoming call · mobile')}</div><div class="manager-instruction"><span>${sf('lock')}</span><p>${esc('Do not answer. Let this call ring out.')}</p></div><div class="call-answer-actions">${btn('manager-ignore',`<span>${sf('phone')}</span>${esc('Ignore')}`)}${btn('manager-answer',`<span>${sf('phone')}</span>${esc('Accept')}`,'','disabled aria-disabled="true"')}</div>`;
}
function ignoreManager(){
 if(!ui.managerRinging)return;stopRingtone();ui.managerOverlay=false;$('call').hidden=true;
 $('manager-banner').innerHTML=`<span class="manager-mini-icon">${sf('phone')}</span><span><strong>${esc('Manager')}</strong><small>${esc('Do not answer. Let this call ring out.')}</small></span>`;
 $('manager-banner').hidden=false;
}
function reopenManager(){if(!ui.managerRinging)return;ui.managerOverlay=true;$('manager-banner').hidden=true;$('call').hidden=false;renderManagerCall()}
function missManagerCall(){
 const e=event(),burst=st.managerBurst;if(e?.type!=='managerCalls'||!burst)return;
 stopRingtone();const recordId=burst.id+'-'+burst.completed;
 if(!st.calls.some(c=>c.eventId===recordId))st.calls.push({id:'manager',eventId:recordId,at:burst.callAt||st.date,direction:'missed',missed:true,duration:0});
 burst.completed++;st.date=new Date(new Date(st.date).getTime()+25000).toISOString();
 ui.managerRinging=false;ui.managerOverlay=false;$('call').hidden=true;$('manager-banner').hidden=true;save();refreshActive();
 if(burst.completed>=e.count){finishManagerBurst();return}
 const token=generation;ui.managerGapTimer=setTimeout(()=>{if(token===generation&&event()?.type==='managerCalls'&&unlocked)ringManager()},st.settings.speed==='instant'?200:750);
}
function finishManagerBurst(){clearManagerTimers();st.managerBurst=null;ui.pending=null;st.step++;save();pump()}

// ===== SAFARI ARTICLE IMAGES AND BOYS PLANET PROFILES =====
// Use raw file paths here; filenames must never pass through text translation.
function mediaURL(source){
 if(!source)return '';
 const path=String(source).trim();if(!path)return '';
 if(/^(data:|blob:)/i.test(path))return path;
 const hashIndex=path.indexOf('#'),base=hashIndex<0?path:path.slice(0,hashIndex),hash=hashIndex<0?'':path.slice(hashIndex);
 return base+(base.includes('?')?'&':'?')+'auasset='+encodeURIComponent(AUTHOR.assetVersion||REVISION)+hash;
}
function articleImage(article){
 const configured=AUTHOR.articleImages?.[article.imageKey||article.id];
 const photoKey=article.fallbackPhoto;
 const source=configured||AUTHOR.photos[photoKey]?.src||portraitSource(article.portrait,false)||'';
 return `<figure class="article-photo"><img src="${rawEsc(mediaURL(source))}" alt="${esc(article.title)}" data-article-image data-fallback-photo="${rawEsc(photoKey||'stage')}" ${source?'':'hidden'}><div class="article-image-placeholder" ${source?'hidden':''}>${art(AUTHOR.photos[photoKey]?.kind||'stage',article.title)}</div><figcaption>${esc(article.title)}</figcaption></figure>`;
}
function profileSheetSource(p){return AUTHOR.boysPlanetProfiles?.[p.portrait]||BP_PROFILE_ASSETS[p.portrait]}
function profileSheetImage(p,detail=false){return `<img class="bp-profile-sheet" src="${rawEsc(mediaURL(profileSheetSource(p)))}" alt="${esc(p.name+' — Boys Planet self-introduction sheet')}" data-bp-profile="${rawEsc(p.portrait)}" ${detail?'':'loading="lazy"'}>`}
function profileCards(){return `<div class="bp-editorial-profiles">${BP_PARTICIPANTS.map(p=>`<section class="bp-editorial-profile"><h2>${esc(p.name)}</h2><p class="subtitle">${esc(p.group)}</p><figure>${btn('participant-open',profileSheetImage(p),'bp-sheet-open',`data-id="${p.id}" aria-label="${esc('Open '+p.name+' profile sheet')}"`)}<figcaption>${esc('Boys Planet self-introduction sheet')}</figcaption></figure></section>`).join('')}</div>`}
function profilePage(id){
 const p=BP_PARTICIPANTS.find(x=>x.id===id);if(!p)return '';
 return nav(back('participant-back','Article'),'Boys Planet')+`<div class="safari-url">${sf('lock')} seoulculture.example</div><article class="bp-sheet-page"><h1>${esc(p.name)}</h1><p class="subtitle">${esc(p.group)} · ${esc('Boys Planet self-introduction sheet')}</p>${btn('bp-sheet-zoom',sf('search')+esc(ui.bpZoom?'Fit to screen':'Enlarge profile sheet'),'secondary bp-zoom-control',`aria-pressed="${!!ui.bpZoom}"`)}<div class="bp-sheet-viewport ${ui.bpZoom?'is-zoomed':''}">${profileSheetImage(p,true)}</div>${btn('participant-back','Back to article','secondary')}${event()?.type==='journal'?btn('quest','Continue story','primary'):''}</article>`;
}
function openParticipant(id){
 if(st.world!==3||!st.newsRead.includes('bp-contestants')||!BP_PARTICIPANTS.some(p=>p.id===id))return;
 ui.participant=id;ui.bpZoom=false;if(id==='sung-han-bin')st.flags.bpHanbinFound=true;save();renderSafari();pump();
}
function submitSafariSearch(query){
 ui.safariQuery=query.trim();ui.article=null;ui.participant=null;
 if(st.world===3&&/boys[\s-]*planet|보이즈\s*플래닛|보플/i.test(ui.safariQuery)){st.flags.bpSearched=true;save()}
 renderSafari();pump();
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;switch(b.dataset.a){
 case'manager-ignore':ignoreManager();break;
 case'manager-show':reopenManager();break;
 case'bp-sheet-zoom':ui.bpZoom=!ui.bpZoom;renderSafari();break;
 case'participant-open':openParticipant(b.dataset.id);break;
 case'participant-back':ui.participant=null;renderSafari();break;
 case'bp-search':submitSafariSearch('Boys Planet contestants');break;
}});
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement&&e.target.hasAttribute('data-article-image')){e.target.hidden=true;const fallback=e.target.closest('figure')?.querySelector('.article-image-placeholder');if(fallback)fallback.hidden=false}},true);

// A custom replacement path may be wrong; retain the supplied profile sheet as a fallback.
document.addEventListener('error',e=>{const img=e.target;if(img instanceof HTMLImageElement&&img.dataset.bpProfile&&!img.dataset.bpFallback){img.dataset.bpFallback='yes';img.src=BP_PROFILE_ASSETS[img.dataset.bpProfile]}},true);

document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAutoTyping()});

initSpotifyMusic();
</script>
</body></html>
